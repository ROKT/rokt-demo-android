version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-java
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot

  - package-ecosystem: github-actions
    directory: /.github/actions/build-apk
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot

  - package-ecosystem: github-actions
    directory: /.github/actions/upload-apk
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
